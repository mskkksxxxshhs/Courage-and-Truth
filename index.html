<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>جرعت حقیقت</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 20px;
            padding: 15px;
        }

        .title {
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.8em;
            margin-bottom: 15px;
        }

        .status {
            text-align: center;
            background: #fff3cd;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 0.85em;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .input-row input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 0.9em;
        }

        .input-row button {
            padding: 10px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .mode-btns {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .mode-btns button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            background: #eee;
        }

        .mode-btns .active-boys {
            background: #4a90e2;
            color: white;
        }

        .mode-btns .active-girls {
            background: #e91e63;
            color: white;
        }

        .wheel-box {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 15px;
        }

        .wheel-box svg {
            width: 100%;
            height: 100%;
            transition: transform 4s ease-out;
        }

        .pointer-arrow {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2em;
            z-index: 10;
            animation: bounce 0.8s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }

        .spin-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .spin-btn:active {
            background: #c0392b;
        }

        .spin-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .result-box {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
            display: none;
        }

        .result-box .gold {
            background: #FFD700;
            padding: 3px 10px;
            border-radius: 8px;
        }

        .result-box .green {
            background: #4ECDC4;
            padding: 3px 10px;
            border-radius: 8px;
            color: white;
        }

        .players-list {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
        }

        .players-list h3 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .player-item.gold-border {
            border: 2px solid #FFD700;
            background: #fffdf0;
        }

        .player-item.green-border {
            border: 2px solid #4ECDC4;
            background: #f0fff0;
        }

        .delete-btn {
            background: #ff4444;
            color: white;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
        }

        .overlay.show {
            display: flex;
        }

        .question-popup {
            background: white;
            border-radius: 15px;
            padding: 20px;
            width: 90%;
            max-width: 320px;
            text-align: center;
        }

        .question-popup .who {
            font-size: 1em;
            margin-bottom: 10px;
        }

        .question-popup .question {
            font-size: 1.2em;
            color: #e74c3c;
            font-weight: bold;
            background: #fff5f5;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .question-popup .btns {
            display: flex;
            gap: 10px;
        }

        .question-popup .btns button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 1em;
        }

        .btn-yes {
            background: #4ECDC4;
        }

        .btn-no {
            background: #FF6B6B;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        .question-count {
            text-align: center;
            font-size: 0.75em;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>

            "تا به حال چشم ت به یک پسر / دختر افتادی .",
            "آیا دوست داشتی دختر باشی یا پسر؟",

            "چقدر به خود اعتماد داری ؟!",

            "بزرگترین دروغی که گفتی؟",
            "از کدوم دختر خوشت میاد؟",

            "بزرگترین ترست چیه؟",
            "کی رو بوسیدی؟",

        ];

        const girlsQAll = [
            "آخرین باری که گریه کردی؟",
            "از کدوم پسر خوشت میاد؟",
            "بزرگترین دروغت؟",
            "به کی پیام عاشقانه دادی؟",
            "زشت‌ترین عادتت؟",
            "بزرگترین ترست؟",
            "احمقانه‌ترین کارت؟",
            "رازی که نگفتی؟",
            "اولین عشقت کی بود؟",
            "آخرین پیامی که پاک کردی مال کی بود؟",
            "چه کسی رو بلاک کردی و چرا؟",
            "عکس آخرین چتت رو نشون بده",
            "چه آرزویی داری که به کسی نگفتی؟",
            "از کی متنفری و چرا؟",
            "آخرین باری که حسودی کردی کی بود؟",
        ];

        // ست کردن مد
        function setMode(m) {
            mode = m;
            document.getElementById('boysBtn').className = m === 'boys' ? 'active-boys' : '';
            document.getElementById('girlsBtn').className = m === 'girls' ? 'active-girls' : '';
        }

        // گرفتن سوالات موجود بر اساس مد
        function getAllQuestions() {
            return mode === 'boys' ? [...boysQAll] : [...girlsQAll];
        }

        // گرفتن سوال تصادفی که قبلاً پرسیده نشده
        function getRandomQuestion() {
            const allQuestions = getAllQuestions();
            
            // سوالاتی که هنوز پرسیده نشدن
            const availableQuestions = allQuestions.filter(q => !usedQuestions.includes(q));
            
            if (availableQuestions.length === 0) {
                // همه سوالات پرسیده شدن - ریست کن
                showToast('🔄 همه سوالات پرسیده شدن! سوالات ریست شد.');
                usedQuestions = [];
                updateQuestionCount();
                return allQuestions[Math.floor(Math.random() * allQuestions.length)];
            }
            
            const randomIndex = Math.floor(Math.random() * availableQuestions.length);
            const chosenQuestion = availableQuestions[randomIndex];
            
            // اضافه به سوالات استفاده شده
            usedQuestions.push(chosenQuestion);
            updateQuestionCount();
            
            return chosenQuestion;
        }

        // بروزرسانی نمایش تعداد سوالات باقیمانده
        function updateQuestionCount() {
            const allQuestions = getAllQuestions();
            const remaining = allQuestions.length - usedQuestions.length;
            const countEl = document.getElementById('questionCount');
            
            if (players.length > 0) {
                countEl.textContent = `📝 سوالات باقیمانده: ${remaining} از ${allQuestions.length}`;
            } else {
                countEl.textContent = '';
            }
        }

        // اضافه کردن بازیکن
        function addPlayer() {
            const input = document.getElementById('nameInput');
            const name = input.value.trim();
            
            if (!name) {
                showToast('⚠️ اسم رو وارد کن!');
                return;
            }
            
            if (players.find(p => p.name === name)) {
                showToast('⚠️ این اسم قبلاً اضافه شده!');
                return;
            }
            
            if (players.length >= 12) {
                showToast('⚠️ حداکثر ۱۲ نفر میتونی اضافه کنی!');
                return;
            }
            
            players.push({ name });
            input.value = '';
            input.focus();
            
            // ریست کردن حالت
            phase = 'asker';
            chosenAsker = null;
            chosenAnswerer = null;
            
            drawWheel();
            showPlayers();
            updateQuestionCount();
            updateStatus();
        }

        // حذف بازیکن
        function removePlayer(index) {
            if (isSpinning) return;
            
            players.splice(index, 1);
            
            // ریست انتخاب‌ها
            phase = 'asker';
            chosenAsker = null;
            chosenAnswerer = null;
            
            drawWheel();
            showPlayers();
            
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('overlay').classList.remove('show');
            updateQuestionCount();
            updateStatus();
        }

        // بروزرسانی وضعیت
        function updateStatus() {
            const status = document.getElementById('status');
            if (players.length < 2) {
                status.textContent = '👆 حداقل ۲ بازیکن اضافه کن';
                document.getElementById('spinBtn').disabled = true;
            } else {
                if (phase === 'asker') {
                    status.textContent = '🎯 گردونه رو بچرخون تا سوال‌کننده مشخص بشه';
                } else {
                    status.textContent = '🎯 حالا گردونه رو بچرخون تا جواب‌دهنده مشخص بشه';
                }
                document.getElementById('spinBtn').disabled = false;
            }
        }

        // کشیدن گردونه
        function drawWheel() {
            const svg = document.getElementById('wheelSvg');
            const cx = 150, cy = 150, r = 145;

            if (players.length === 0) {
                svg.innerHTML = `
                    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#eee" stroke="#333" stroke-width="4"/>
                    <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="14" fill="#999">بازیکن اضافه کن</text>
                `;
                return;
            }

            const angle = 360 / players.length;
            let paths = '';

            players.forEach((p, i) => {
                const startDeg = i * angle - 90;
                const endDeg = startDeg + angle;
                const midDeg = startDeg + angle/2;

                const startRad = startDeg * Math.PI / 180;
                const endRad = endDeg * Math.PI / 180;

                const x1 = cx + r * Math.cos(startRad);
                const y1 = cy + r * Math.sin(startRad);
                const x2 = cx + r * Math.cos(endRad);
                const y2 = cy + r * Math.sin(endRad);

                const d = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2} Z`;

                const tr = r * 0.6;
                const tx = cx + tr * Math.cos(midDeg * Math.PI / 180);
                const ty = cy + tr * Math.sin(midDeg * Math.PI / 180);
                const rot = midDeg + 90;

                let strokeW = 3;
                let strokeC = 'white';
                if (phase === 'answerer' && chosenAsker === i) {
                    strokeW = 6;
                    strokeC = '#FFD700';
                }
                if (phase === 'asker' && chosenAnswerer === null && chosenAsker === i) {
                    strokeW = 6;
                    strokeC = '#FFD700';
                }

                paths += `
                    <path d="${d}" fill="${colors[i % 8]}" stroke="${strokeC}" stroke-width="${strokeW}"/>
                    <text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle"
                          transform="rotate(${rot}, ${tx}, ${ty})"
                          font-size="${players.length > 5 ? 9 : 11}" font-weight="bold" fill="white">
                        ${p.name}
                    </text>
                `;
            });

            svg.innerHTML = paths + `<circle cx="${cx}" cy="${cy}" r="22" fill="white" stroke="#333" stroke-width="3"/>`;
        }

        // نمایش بازیکنان در لیست
        function showPlayers() {
            const container = document.getElementById('playersContainer');
            if (players.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#999;padding:15px;">کسی اضافه نشده</div>';
                return;
            }

            container.innerHTML = players.map((p, i) => {
                let cls = '';
                if (phase === 'asker' && chosenAsker === i && chosenAnswerer === null) {
                    cls = 'gold-border';
                } else if (phase === 'answerer' && chosenAsker === i) {
                    cls = 'gold-border';
                } else if (phase === 'answerer' && chosenAnswerer === i) {
                    cls = 'green-border';
                }

                return `
                    <div class="player-item ${cls}">
                        <span>${cls.includes('gold') ? '⭐ ' : cls.includes('green') ? '🎯 ' : ''}${p.name}</span>
                        <button class="delete-btn" onclick="removePlayer(${i})">✕</button>
                    </div>
                `;
            }).join('');
        }

        // چرخوندن گردونه
        function spin() {
            if (isSpinning) return;
            if (players.length < 2) {
                showToast('⚠️ حداقل ۲ بازیکن لازمه!');
                return;
            }

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('overlay').classList.remove('show');

            // چرخش تصادفی
            const extraAngle = Math.floor(Math.random() * 360) + 720;
            currentAngle += extraAngle;
            document.getElementById('wheelSvg').style.transform = `rotate(${currentAngle}deg)`;

            // بعد از چرخش
            setTimeout(() => {
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;

                // محاسبه برنده
                const anglePerPlayer = 360 / players.length;
                const normalizedAngle = ((currentAngle % 360) + 360) % 360;
                const arrowAngle = 0; // فلش بالاست
                
                let winnerIndex = Math.floor(((360 - normalizedAngle + arrowAngle + anglePerPlayer/2) % 360) / anglePerPlayer);
                winnerIndex = winnerIndex % players.length;

                if (phase === 'asker') {
                    // فاز اول: انتخاب سوال‌کننده
                    chosenAsker = winnerIndex;
                    chosenAnswerer = null;
                    phase = 'answerer';
                    
                    drawWheel();
                    showPlayers();
                    updateStatus();
                    
                    document.getElementById('askerSpan').textContent = players[chosenAsker].name;
                    document.getElementById('answererSpan').textContent = '؟؟؟';
                    document.getElementById('resultBox').style.display = 'block';
                    
                    showToast(`✅ ${players[chosenAsker].name} سوال میپرسه! حالا دوباره بچرخون`);
                    
                } else if (phase === 'answerer') {
                    // فاز دوم: انتخاب جواب‌دهنده
                    // نباید خودش باشه
                    if (winnerIndex === chosenAsker) {
                        winnerIndex = (winnerIndex + 1) % players.length;
                    }
                    chosenAnswerer = winnerIndex;

                    drawWheel();
                    showPlayers();

                    document.getElementById('askerSpan').textContent = players[chosenAsker].name;
                    document.getElementById('answererSpan').textContent = players[chosenAnswerer].name;
                    document.getElementById('resultBox').style.display = 'block';

                    // نمایش سوال
                    const question = getRandomQuestion();
                    document.getElementById('whoAsks').textContent = 
                        `${players[chosenAsker].name} از ${players[chosenAnswerer].name} میپرسه:`;
                    document.getElementById('questionDisplay').textContent = question;
                    document.getElementById('overlay').classList.add('show');
                }
            }, 4100);
        }

        // جواب دادن
        function answer(did) {
            document.getElementById('overlay').classList.remove('show');
            
            // ریست برای دور بعد
            phase = 'asker';
            chosenAsker = null;
            chosenAnswerer = null;
            
            drawWheel();
            showPlayers();
            updateStatus();
            
            document.getElementById('resultBox').style.display = 'none';
        }

        // نمایش پیام
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // کیبورد
        document.getElementById('nameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') addPlayer();
        });

        // شروع
        updateStatus();
        drawWheel();
        showPlayers();
    </script>
